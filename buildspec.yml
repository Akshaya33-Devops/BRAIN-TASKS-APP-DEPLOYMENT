version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 885232248527.dkr.ecr.ap-south-1.amazonaws.com

  build:
    commands:
      - echo Building Docker image...
      - docker build -t brain-tasks-app .
      - docker tag brain-tasks-app:latest 885232248527.dkr.ecr.ap-south-1.amazonaws.com/brain-tasks-app:latest

  post_build:
    commands:
      - echo Pushing Docker image to ECR...
      - docker push 885232248527.dkr.ecr.ap-south-1.amazonaws.com/brain-tasks-app:latest
      - echo Updating Kubernetes deployment...
      - aws eks update-kubeconfig --region ap-south-1 --name brain-tasks-cluster
      - kubectl apply -f deployment.yaml
      - kubectl apply -f service.yaml
      - kubectl rollout restart deployment/brain-tasks-app
      - kubectl rollout status deployment/brain-tasks-app

artifacts:
  files:
    - deployment.yaml
    - service.yaml